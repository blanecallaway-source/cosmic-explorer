name: Install NASA and planetary texture maps
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/planet-textures.yml'
permissions:
  contents: write
jobs:
  textures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify planet maps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin, urlparse
          from pathlib import Path
          import time
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      href=dict(attrs).get('href','')
                      if href.lower().split('?')[0].endswith(('.jpg','.jpeg')): self.links.append(href)
          def download(url):
              req=Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; CosmicExplorer/1.0)'})
              with urlopen(req,timeout=45) as response: return response.read()
          def valid(data):
              return len(data)>10000 and data[:3]==bytes([255,216,255])
          Path('textures').mkdir(exist_ok=True)
          rocky=['mercury','venus','earth','moon','mars']
          for name in rocky:
              page='https://maps.jpl.nasa.gov/tmaps/'+name+'.html'
              try:
                  html=download(page).decode('latin1')
                  parser=Links();parser.feed(html)
                  urls=[urljoin(page,link) for link in parser.links]
                  if not urls: raise RuntimeError('No JPEG download links on '+page)
                  data=None
                  for url in urls:
                      try:
                          candidate=download(url)
                          if valid(candidate): data=candidate;print('JPL:',name,url,len(data));break
                      except Exception as ex: print('JPL image failed:',url,ex)
                  if data is None: raise RuntimeError('No valid JPL JPEG found for '+name)
              except Exception as ex:
                  print('JPL unavailable for',name,ex,'; trying secondary photographic map')
                  alias={'venus':'venus_surface','earth':'earth_daymap','moon':'moon'}.get(name,name)
                  data=download('https://www.solarsystemscope.com/textures/download/2k_'+alias+'.jpg')
              if not valid(data): raise RuntimeError('Invalid image for '+name)
              Path('textures/'+name+'.jpg').write_bytes(data)
          for name in ['jupiter','saturn','uranus','neptune']:
              url='https://www.solarsystemscope.com/textures/download/2k_'+name+'.jpg'
              data=download(url)
              if not valid(data): raise RuntimeError('Invalid image for '+name)
              Path('textures/'+name+'.jpg').write_bytes(data)
              print('Installed:',name,len(data))
          for name in ['mercury','venus','earth','moon','mars','jupiter','saturn','uranus','neptune']:
              path=Path('textures/'+name+'.jpg')
              if not path.exists() or not valid(path.read_bytes()): raise RuntimeError('Missing or corrupt '+name)
          print('All 9 texture files verified')
          PY
      - name: Commit installed image files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textures/
          if ! git diff --cached --quiet; then
            git commit -m "Install verified planetary photo textures"
            git push origin HEAD:main
          fi
