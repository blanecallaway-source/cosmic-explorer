name: Install verified planetary maps
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/planet-textures.yml'
permissions:
  contents: write
jobs:
  textures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch existing CC BY planetary textures from GitHub mirrors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen, Request
          from urllib.error import HTTPError, URLError
          import struct
          sources={
            'mercury':['https://raw.githubusercontent.com/sudoaanish/COSMOS/master/assets/textures/mercury-2k.jpg'],
            'venus':['https://raw.githubusercontent.com/sudoaanish/COSMOS/master/assets/textures/venus-2k.jpg'],
            'earth':['https://raw.githubusercontent.com/sudoaanish/COSMOS/master/assets/textures/earth-2k.jpg','https://raw.githubusercontent.com/homer-jay/solar-system-textures/main/earth_daymap.jpg'],
            'moon':['https://raw.githubusercontent.com/sudoaanish/COSMOS/master/assets/textures/moon-2k.jpg','https://raw.githubusercontent.com/sudoaanish/COSMOS/master/assets/textures/moon.jpg'],
            'mars':['https://raw.githubusercontent.com/sudoaanish/COSMOS/master/assets/textures/mars-2k.jpg'],
            'jupiter':['https://raw.githubusercontent.com/sudoaanish/COSMOS/master/assets/textures/jupiter-2k.jpg'],
            'saturn':['https://raw.githubusercontent.com/sudoaanish/COSMOS/master/assets/textures/saturn-2k.jpg'],
            'uranus':['https://raw.githubusercontent.com/sudoaanish/COSMOS/master/assets/textures/uranus-2k.jpg'],
            'neptune':['https://raw.githubusercontent.com/sudoaanish/COSMOS/master/assets/textures/neptune-2k.jpg']
          }
          def is_jpeg(data):
              return len(data)>10000 and data[:3]==bytes((255,216,255)) and data[-2:]==bytes((255,217))
          Path('textures').mkdir(exist_ok=True)
          failures=[]
          for planet,urls in sources.items():
              done=False
              for url in urls:
                  try:
                      req=Request(url,headers={'User-Agent':'CosmicExplorer-texture-installer'})
                      with urlopen(req,timeout=35) as resp: data=resp.read()
                      if not is_jpeg(data): raise ValueError('Not a complete JPEG: '+str(len(data))+' bytes')
                      Path('textures',planet+'.jpg').write_bytes(data)
                      print('INSTALLED',planet,len(data),'bytes',url,flush=True)
                      done=True;break
                  except Exception as exc: print('SOURCE FAILED',planet,url,repr(exc),flush=True)
              if not done: failures.append(planet)
          if failures: print('WARNING: Missing textures: '+', '.join(failures),flush=True)
          print('FINISHED: downloaded '+str(len(sources)-len(failures))+' of '+str(len(sources))+' maps',flush=True)
          PY
      - name: Commit textures to site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textures/
          if ! git diff --cached --quiet; then
            git commit -m "Install licensed realistic planet textures"
            git push origin HEAD:main
          fi
